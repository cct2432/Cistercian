[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cistercian"
version = "0.1.0"
description = "A small Python package for generating Cistercian Numeral SVGs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "cct2432" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/cct2432/Cistercian"

[project.scripts]
cistercian = "src.cli:main"
